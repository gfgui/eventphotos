# Local mode: Postgres and Garage on the host notebook. Variables come from .env.
name: event-photos

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Only this machine: guests share the event Wi-Fi.
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 keeps its data in a versioned folder under this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
    ports:
      # S3 API: phones upload straight to it through presigned URLs.
      - "3900:3900"
      # Admin API: only this machine.
      - "127.0.0.1:3903:3903"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs once and exits: node layout, bucket, access key and permissions.
  garage-init:
    image: node:22-alpine
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - ./scripts/garage-init.mjs:/garage-init.mjs:ro
    command: ["node", "/garage-init.mjs"]
    restart: "no"

  # Load test, only when asked for: npm run load:run. See "Load test" in the README.
  k6:
    image: grafana/k6:2.4.0
    profiles: ["load-test"]
    # The app and the storage listen on the notebook, outside this container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BASE_URL: http://host.docker.internal:3000
      STORAGE_HOST: host.docker.internal:3900
      # Empty unless set when running, which keeps the script's defaults.
      GUESTS: ${GUESTS:-}
      UPLOADERS: ${UPLOADERS:-}
      PHOTOS: ${PHOTOS:-}
      DURATION: ${DURATION:-}
      LIKERS: ${LIKERS:-}
      ROUNDS: ${ROUNDS:-}
    volumes:
      - ./load-tests:/load-tests
    command: ["run", "/load-tests/guests.js"]
    restart: "no"

volumes:
  postgres-data:
  garage-meta:
  garage-data:
