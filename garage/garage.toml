# Single-node Garage for local mode.
# rpc_secret and admin_token come from GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN (see docker-compose.yml).

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
# SQLite copes with an abrupt shutdown of the host notebook better than LMDB.
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# Must match S3_REGION in .env, which the app uses to sign requests.
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
